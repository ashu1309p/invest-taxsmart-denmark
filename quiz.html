<style>
  /* Page-specific design tokens (the ONE site-wide cool palette). Shared chrome lives in
     css/styles.css, linked LAST. */
  :root{
    --bg:#EEF2F6; --card:#FFFFFF;
    --ink:#0F172A; --ink-2:#334155; --muted:#586577; --muted-2:#64748B;
    --line:#E3E8EF; --line-soft:#EDF1F6; --sunken:#F2F5F9;
    --accent:#0F766E; --accent-strong:#0B5D56; --accent-ink:#0B5D56;
    --accent-soft:#E6F3F1; --accent-line:#C7E6E1;
    --success:#15803D; --success-soft:#ECFDF5; --success-line:#A7F3D0; --success-ink:#166534;
    --warn:#B45309; --warn-soft:#FFFBEB; --warn-line:#FCE3A6; --warn-ink:#8A4B08;
    --danger:#DC2626; --danger-soft:#FEF2F2; --danger-line:#FBD0D0; --danger-ink:#9F1D1D;
    --radius:18px; --radius-sm:12px; --radius-lg:22px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 16px rgba(15,23,42,.06), 0 14px 34px rgba(15,23,42,.05);
    --shadow-lg:0 2px 4px rgba(15,23,42,.05), 0 14px 30px rgba(15,23,42,.10), 0 30px 64px rgba(15,23,42,.10);
    --space-sec:64px;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  .site-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:680px;margin:0 auto;gap:8px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;white-space:nowrap}
  .brand .dot{width:11px;height:11px;border-radius:50%}
  .lang-toggle button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:.85rem;padding:7px 12px;cursor:pointer;min-width:42px}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1200px 480px at 50% -260px, rgba(15,118,110,.07), transparent 70%),
      linear-gradient(180deg,#F3F6FA 0%, #EEF2F6 320px) fixed;
    color:var(--ink); line-height:1.6; letter-spacing:-.003em; padding-bottom:64px;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  .kicker{display:inline-flex;align-items:center;gap:9px;color:var(--accent);font-weight:700;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;margin:var(--space-sec) 0 6px}
  .kicker::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--accent);display:inline-block}
  h1{font-size:clamp(2.1rem,6vw,2.75rem);font-weight:800;line-height:1.06;letter-spacing:-.028em;color:var(--ink);margin:0 0 12px}
  .lead{color:var(--muted);font-size:1.08rem;line-height:1.55;max-width:36em;margin:0 0 24px}
  .testbadge{font-size:.75rem;color:var(--muted);margin-top:22px}
  .testbadge.fail{color:var(--danger);font-weight:700}

  /* ---------- progress dots ---------- */
  .quiz-dots{display:flex;gap:7px;justify-content:center;margin:0 0 16px}
  .qdot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .2s var(--ease),transform .2s var(--ease)}
  .qdot.done{background:var(--accent-line)}
  .qdot.current{background:var(--accent);transform:scale(1.35)}

  /* ---------- quiz card ---------- */
  .quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  @media(min-width:560px){.quiz-card{padding:26px}}
  .qcount{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);margin:0 0 10px}
  .qscenario{font-size:1.12rem;font-weight:700;line-height:1.4;color:var(--ink);margin:0 0 14px;text-wrap:pretty}
  .qask{font-size:.9rem;font-weight:600;color:var(--ink-2);margin:0 0 12px}
  .qopts{display:flex;flex-direction:column;gap:10px}
  .qopt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;font:inherit;font-size:.96rem;line-height:1.45;color:var(--ink-2);cursor:pointer;min-height:56px;transition:border-color .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease),transform .12s var(--ease)}
  .qopt:hover{border-color:var(--accent-line);background:#FAFDFC}
  .qopt:active{transform:scale(.99)}
  .qopt:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
  .qopt .qmark{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-soft);margin-top:1px;position:relative;transition:border-color .16s var(--ease),background .16s var(--ease)}
  .qopt .qtx{flex:1}
  .qopt[disabled]{cursor:default}
  .qopt.correct{border-color:var(--success-line);background:var(--success-soft);color:var(--success-ink)}
  .qopt.correct .qmark{border-color:var(--success);background:var(--success)}
  .qopt.correct .qmark::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .qopt.wrong{border-color:var(--danger-line);background:var(--danger-soft);color:var(--danger-ink)}
  .qopt.wrong .qmark{border-color:var(--danger);background:var(--danger)}
  .qopt.wrong .qmark::after{content:"";position:absolute;left:5px;top:4px;width:9px;height:9px;background:linear-gradient(45deg,transparent 43%,#fff 43% 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,#fff 43% 57%,transparent 57%)}
  .qopt.dim{opacity:.5}
  .qhint{font-size:.8rem;color:var(--muted);text-align:center;margin:12px 0 0}

  /* ---------- reveal ---------- */
  .qreveal{margin-top:16px;border-radius:14px;padding:14px 16px;border:1px solid;border-left-width:4px}
  .qreveal.ok{background:var(--success-soft);border-color:var(--success-line);border-left-color:var(--success)}
  .qreveal.no{background:var(--warn-soft);border-color:var(--warn-line);border-left-color:var(--warn)}
  .qverdict{font-weight:800;font-size:1rem;margin-bottom:5px}
  .qreveal.ok .qverdict{color:var(--success-ink)}
  .qreveal.no .qverdict{color:var(--warn-ink)}
  .qexpl{font-size:.92rem;line-height:1.6;color:var(--ink-2);margin:0 0 10px}
  .qlink{font-weight:700;font-size:.9rem;color:var(--accent);text-decoration:none}
  .qlink:hover{text-decoration:underline}

  /* ---------- nav / buttons ---------- */
  .qnav{margin-top:16px;display:flex;justify-content:flex-end}
  .qnav-wrap{flex-wrap:wrap;gap:10px;justify-content:center}
  .qbtn{font:inherit;font-weight:700;font-size:.95rem;padding:13px 22px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;min-height:48px;transition:background .16s var(--ease),box-shadow .16s var(--ease)}
  .qbtn:hover{background:var(--accent-strong)}
  .qbtn:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
  .qbtn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent-line)}
  .qbtn.ghost:hover{background:var(--accent-soft)}

  /* ---------- result ---------- */
  .qresult{text-align:center}
  .qscore{font-size:2rem;font-weight:900;letter-spacing:-.02em;color:var(--accent);margin:6px 0 4px;font-variant-numeric:tabular-nums}
  .qmsg{font-size:1rem;color:var(--ink-2);margin:0 0 18px;line-height:1.5}
  .qshared{font-size:.82rem;color:var(--success-ink);min-height:1.2em;margin:10px 0 0}
  .qplan{display:inline-block;margin-top:14px;font-weight:700;font-size:.92rem;color:var(--accent);text-decoration:none}
  .qplan:hover{text-decoration:underline}
</style>
